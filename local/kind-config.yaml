# Free local lab: a 1 control-plane + 2 worker kind cluster for practising
# Argo CD and the gitops/ manifests without an AWS bill.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: eks-platform-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1
    # Mirrors the AWS topology label so topologySpreadConstraints behave similarly.
    labels:
      topology.kubernetes.io/zone: lab-a
  - role: worker
    image: kindest/node:v1.33.1
    labels:
      topology.kubernetes.io/zone: lab-a
  - role: worker
    image: kindest/node:v1.33.1
    labels:
      topology.kubernetes.io/zone: lab-b
